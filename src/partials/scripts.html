<!-- ===== FLOATING "BOOK A CALL" — bottom right, desktop =====
     TODO(Alex): set BOOKING_URL in the script below to the client's Google
     Appointment Schedule link once they've finished setting it up. Until then
     this falls back to the on-page enquiry form (#book) so it's never a dead
     end. -->
<a id="call-cta" href="/#book" class="sws-desktop"
   style="position:fixed;right:24px;bottom:24px;z-index:99;display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:#1B76BC;color:#fff;text-decoration:none;font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;box-shadow:0 10px 34px rgba(20,46,69,.32);transition:transform .25s cubic-bezier(.2,0,0,1),box-shadow .25s ease">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
  <span>Book a call</span>
</a>

<!-- ===== STICKY MOBILE CTA ===== -->
<div class="sws-mobileonly" style="position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;gap:12px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -8px 30px rgba(20,46,69,.15)">
  <a href="tel:0409898232" class="sws-btn sws-btn-secondary" style="flex:1;font-size:16px;padding:10px 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h4l2 5-2.5 1.5a12 12 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2Z"></path></svg>Call</a>
  <a href="/#book" data-book-open class="sws-btn sws-btn-primary" style="flex:1.4;font-size:16px;padding:10px 8px">Book a free lesson</a>
</div>

<!-- ===== COOKIE CONSENT =====
     Hidden by default and only revealed by JS when a choice hasn't been made
     and a pixel ID is actually configured, so it never nags without cause.
     Sits above the mobile CTA bar. -->
<div id="sws-consent" hidden role="dialog" aria-labelledby="sws-consent-title" aria-describedby="sws-consent-text"
     style="position:fixed;left:16px;right:16px;bottom:16px;z-index:120;max-width:560px;margin:0 auto;padding:20px 22px;border-radius:14px;background:#142E45;color:#fff;box-shadow:0 14px 44px rgba(20,46,69,.4)">
  <p id="sws-consent-title" style="margin:0 0 6px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px">Cookies</p>
  <p id="sws-consent-text" style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#D6E6F4">We'd like to use Meta (Facebook) cookies to measure how well our ads work. Nothing is loaded unless you say yes, and the site works exactly the same either way.</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <button type="button" id="sws-consent-accept" class="sws-btn sws-btn-primary" style="flex:1;min-width:130px;font-size:16px;padding:10px 18px">Accept</button>
    <button type="button" id="sws-consent-decline" class="sws-btn sws-btn-ghost" style="flex:1;min-width:130px;font-size:16px;padding:10px 18px">Decline</button>
  </div>
</div>

<!-- ===== PHOTO LIGHTBOX =====
     One <dialog> shared by any [data-gallery] on the page. Inert until a
     thumbnail is clicked, and it renders nothing when JS is off — the gallery
     thumbnails are still perfectly readable on their own in that case. -->
<dialog class="sws-lb" id="sws-lightbox" aria-label="Photo viewer">
  <div class="sws-lb-stage"><img alt=""></div>
  <p class="sws-lb-cap"><b></b><span></span></p>
  <button type="button" class="sws-lb-prev" aria-label="Previous photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <button type="button" class="sws-lb-next" aria-label="Next photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
  <button type="button" class="sws-lb-close" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</dialog>

<script>
(function () {
  // Mobile menu
  var btn = document.getElementById('menu-btn');
  var menu = document.getElementById('mobile-menu');
  var iconWrap = document.getElementById('menu-icon');
  var menuSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>';
  var closeSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></svg>';
  function setMenu(open) {
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    iconWrap.innerHTML = open ? closeSvg : menuSvg;
  }
  btn.addEventListener('click', function () { setMenu(!menu.classList.contains('open')); });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setMenu(false); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) { setMenu(false); btn.focus(); }
  });
  document.addEventListener('click', function (e) {
    if (menu.classList.contains('open') && !e.composedPath().includes(document.getElementById('site-header'))) setMenu(false);
  });

  // Header shadow on scroll + gentle hero parallax
  var header = document.getElementById('site-header');
  var heroImg = document.querySelector('#top .sws-kenburns');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      header.classList.toggle('scrolled', window.scrollY > 8);
      if (!reducedMotion && heroImg && window.scrollY < window.innerHeight) {
        heroImg.style.setProperty('--py', (window.scrollY * 0.25) + 'px');
      }
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Floating "Book a call" CTA.
  // TODO(Alex): paste the client's Google Appointment Schedule link here (the
  // client is still setting it up). While it's null the button scrolls to the
  // on-page enquiry form instead, so the CTA is never a dead end.
  var BOOKING_URL = null;
  var callCta = document.getElementById('call-cta');
  if (callCta && BOOKING_URL) {
    callCta.href = BOOKING_URL;
    callCta.target = '_blank';
    callCta.rel = 'noopener';
  }
  if (callCta) {
    callCta.addEventListener('mouseenter', function () { callCta.style.transform = 'translateY(-3px)'; });
    callCta.addEventListener('mouseleave', function () { callCta.style.transform = 'none'; });
  }

  // Enquiry form wiring, shared by the inline homepage form and the modal form.
  // Field ids differ per form (f-name vs mf-name), so the validator is keyed by
  // the input's own id and looked up within each form.
  // Cookie consent banner. SWS_CONSENT (head.html) owns the stored choice and
  // the actual loading of the pixel; this is only the UI for it.
  var consentBar = document.getElementById('sws-consent');
  if (consentBar && window.SWS_CONSENT) {
    if (window.SWS_CONSENT.needsPrompt) consentBar.hidden = false;
    function choose(choice) {
      window.SWS_CONSENT.set(choice);
      consentBar.hidden = true;
    }
    document.getElementById('sws-consent-accept').addEventListener('click', function () { choose('granted'); });
    document.getElementById('sws-consent-decline').addEventListener('click', function () { choose('declined'); });
  }

  // ---- Advanced matching ----------------------------------------------
  // Meta matches an enquiry to a Facebook/Instagram account far more reliably
  // when the contact details come with it, but they must be SHA-256 hashed in
  // the browser — raw details never leave the page. Normalisation (lowercase,
  // trimmed, phone in E.164 without the +) is Meta's spec; get it wrong and
  // the hash simply never matches anything.
  function sha256(value) {
    if (!window.crypto || !crypto.subtle) return Promise.resolve(null);
    return crypto.subtle
      .digest('SHA-256', new TextEncoder().encode(value))
      .then(function (buf) {
        return Array.prototype.map
          .call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); })
          .join('');
      })
      .catch(function () { return null; });
  }

  function auPhone(raw) {
    var d = String(raw).replace(/[^0-9]/g, '');
    if (d.indexOf('0') === 0) d = '61' + d.slice(1);       // 04xx -> 614xx
    else if (d.indexOf('61') !== 0) d = '61' + d;
    return d;
  }

  /** Resolves to Meta's advanced-matching object, or {} if nothing usable. */
  function matchData(form) {
    var val = function (n) {
      var el = form.querySelector('[name="' + n + '"]');
      return el && el.value ? el.value.trim() : '';
    };
    var email = val('email').toLowerCase();
    var phone = val('phone');
    var parts = val('name').toLowerCase().split(/\s+/).filter(Boolean);
    var jobs = [
      email ? sha256(email).then(function (h) { return ['em', h]; }) : null,
      phone ? sha256(auPhone(phone)).then(function (h) { return ['ph', h]; }) : null,
      parts.length ? sha256(parts[0]).then(function (h) { return ['fn', h]; }) : null,
      parts.length > 1 ? sha256(parts[parts.length - 1]).then(function (h) { return ['ln', h]; }) : null
    ].filter(Boolean);

    return Promise.all(jobs).then(function (pairs) {
      var out = {};
      pairs.forEach(function (p) { if (p[1]) out[p[0]] = p[1]; });
      return out;
    });
  }

  // Meta Pixel conversions. Fires only if the pixel actually loaded (see the
  // base code in head.html) so the site works unchanged with tracking off.
  function track(event, params) {
    if (typeof window.fbq === 'function') window.fbq('track', event, params || {});
  }

  function wireEnquiryForm(form, successEl, sendError) {
    if (!form) return;
    var submitted = false;
    var checks = {
      name: function (v) { return v.trim().length > 0; },
      phone: function (v) { return /^[\d\s+()-]{8,}$/.test(v); },
      email: function (v) { return v.trim() === '' || /^\S+@\S+\.\S+$/.test(v); },
      // Age is optional — we can sort the right class on the call.
      program: function (v) { return v !== ''; }
    };

    // "Multiple children" has no single age, so prompt for the ages in the
    // message box instead of adding a second age field.
    var ageSel = form.querySelector('[name="age"]');
    var multiHint = ageSel && form.querySelector('.sws-hint');
    if (ageSel && multiHint) {
      ageSel.addEventListener('change', function () {
        multiHint.hidden = ageSel.value !== 'Multiple children';
      });
    }
    function validate() {
      var ok = true;
      Object.keys(checks).forEach(function (nm) {
        var el = form.querySelector('[name="' + nm + '"]');
        if (!el) return;
        var valid = checks[nm](el.value);
        el.closest('.sws-field').classList.toggle('has-error', submitted && !valid);
        if (!valid) ok = false;
      });
      return ok;
    }
    form.addEventListener('input', function () { if (submitted) validate(); });
    form.addEventListener('change', function () { if (submitted) validate(); });
    var submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      submitted = true;
      if (!validate()) return;

      // Safety net, kept after wiring: if the endpoint is ever reverted to a
      // placeholder, fail loudly rather than showing a success panel for a
      // message that was never sent.
      if (form.action.indexOf('FORM_ID') !== -1) {
        sendError.textContent = "This form isn't connected yet. Please call Leesa on 0409 898 232.";
        sendError.hidden = false;
        return;
      }

      sendError.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { Accept: 'application/json' }
      }).then(function (res) {
        if (!res.ok) throw new Error('Formspree responded ' + res.status);
        form.hidden = true;
        successEl.hidden = false;
        // The real conversion: the enquiry reached Formspree. Posted over
        // fetch with no page change, so Meta can only learn about it here.
        // Re-initialising with the hashed details attaches them to this Lead
        // (and only fires once the hashing has actually resolved).
        var source = form.id === 'modal-enquiry-form' ? 'Booking modal' : 'Homepage form';
        if (typeof window.fbq === 'function') {
          matchData(form).then(function (am) {
            fbq('init', window.SWS_META_PIXEL_ID, am);
            track('Lead', { content_name: source });
          });
        }
      }).catch(function () {
        sendError.textContent = 'Something went wrong sending that. Try again, or call Leesa on 0409 898 232.';
        sendError.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Book a free lesson';
      });
    });
  }

  // Homepage inline form (only present on "/").
  wireEnquiryForm(
    document.getElementById('enquiry-form'),
    document.getElementById('form-success'),
    document.getElementById('form-send-error')
  );

  // Booking modal — present on every page via the shared partial.
  var modal = document.getElementById('booking-modal');
  if (modal && typeof modal.showModal === 'function') {
    var lastFocus = null;
    function openModal(trigger) {
      lastFocus = trigger || document.activeElement;
      modal.showModal();
      document.body.classList.add('sws-modal-open');
      // Mid-funnel signal: opened the booking form but hasn't sent it yet.
      // Useful as a retargeting audience, not as the conversion goal.
      track('InitiateCheckout', { content_name: 'Booking modal opened' });
      var firstInput = modal.querySelector('#mf-name');
      if (firstInput) firstInput.focus();
    }
    function closeModal() {
      modal.close();
    }
    // Any element with data-book-open opens the modal instead of navigating.
    document.querySelectorAll('[data-book-open]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        openModal(el);
      });
    });
    modal.querySelectorAll('[data-book-close]').forEach(function (el) {
      el.addEventListener('click', closeModal);
    });
    // Click on the backdrop (outside the card) closes it.
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });
    // Native dialog "close" fires for Escape too; restore scroll and focus here.
    modal.addEventListener('close', function () {
      document.body.classList.remove('sws-modal-open');
      if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
    });
    wireEnquiryForm(
      document.getElementById('modal-enquiry-form'),
      document.getElementById('modal-form-success'),
      document.getElementById('modal-form-send-error')
    );
  }

  // Phone and email clicks count as conversions too — plenty of parents ring
  // rather than fill the form in, and Meta can't see those otherwise.
  document.querySelectorAll('a[href^="tel:"], a[href^="mailto:"]').forEach(function (a) {
    a.addEventListener('click', function () {
      track('Contact', { content_name: a.getAttribute('href').indexOf('tel:') === 0 ? 'Phone' : 'Email' });
    });
  });

  // Program flip cards — front sells the stage, back gives quick facts. CSS
  // flips on hover for pointer devices; this adds tap/keyboard for touch.
  document.querySelectorAll('.sws-pflip').forEach(function (card) {
    card.addEventListener('click', function () {
      var open = card.getAttribute('aria-pressed') === 'true';
      card.setAttribute('aria-pressed', String(!open));
    });
  });

  // Scroll-reveal
  var revealEls = document.querySelectorAll('.rv, .rv-pop');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in'); });
  }

  // Header dropdown. CSS covers hover; this adds click and keyboard, and closes
  // on Escape or an outside click.
  var ddBtn = document.getElementById('dd-btn');
  var ddMenu = document.getElementById('dd-menu');
  if (ddBtn && ddMenu) {
    var setDd = function (open) { ddBtn.setAttribute('aria-expanded', String(open)); };
    ddBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setDd(ddBtn.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && ddBtn.getAttribute('aria-expanded') === 'true') {
        setDd(false);
        ddBtn.focus();
      }
    });
    document.addEventListener('click', function (e) {
      if (!e.composedPath().includes(ddMenu) && e.target !== ddBtn) setDd(false);
    });
    ddMenu.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { setDd(false); });
    });
  }

  // Coach flip cards. CSS handles the flip on hover for pointer devices; this
  // adds click/tap and keyboard toggling, which is the only way in on touch.
  document.querySelectorAll('.sws-flip').forEach(function (card) {
    card.addEventListener('click', function () {
      var open = card.getAttribute('aria-pressed') === 'true';
      card.setAttribute('aria-pressed', String(!open));
    });
  });

  // Marquee: duplicate the visible chips so the -50% translate loops seamlessly.
  // Done here rather than in markup so the source only lists each item once.
  document.querySelectorAll('.sws-marquee-track').forEach(function (track) {
    if (reduced) return;
    track.querySelectorAll('[aria-hidden="true"]').forEach(function (dupe) {
      dupe.remove();
    });
    var originals = Array.prototype.slice.call(track.children);
    originals.forEach(function (node) {
      var clone = node.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      track.appendChild(clone);
    });
  });

  // What-to-bring kit switcher. The three kit lists are all in the markup and
  // visible by default, so with JS off the page degrades to three stacked
  // lists under their own headings. Here we hide all but the selected one and
  // wire the pills up as a tablist (arrow keys included, per the ARIA pattern).
  document.querySelectorAll('[data-kit]').forEach(function (kit) {
    var tabs = Array.prototype.slice.call(kit.querySelectorAll('.sws-kit-tab'));
    var panels = tabs.map(function (tab) {
      return kit.querySelector('#' + tab.getAttribute('aria-controls'));
    });
    if (!tabs.length || panels.indexOf(null) !== -1) return;
    // Signals to the CSS that the per-panel headings are now redundant.
    kit.classList.add('sws-kit-live');

    function select(i, focus) {
      tabs.forEach(function (tab, n) {
        tab.setAttribute('aria-selected', String(n === i));
        // Only the active tab stays in the tab order; arrow keys move between them.
        tab.tabIndex = n === i ? 0 : -1;
        panels[n].hidden = n !== i;
      });
      if (focus) tabs[i].focus();
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () { select(i); });
      tab.addEventListener('keydown', function (e) {
        var to = e.key === 'ArrowRight' ? i + 1
          : e.key === 'ArrowLeft' ? i - 1
          : e.key === 'Home' ? 0
          : e.key === 'End' ? tabs.length - 1
          : -1;
        if (to === -1) return;
        e.preventDefault();
        select((to + tabs.length) % tabs.length, true);
      });
    });

    select(0);
  });

  // Count-up stats
  document.querySelectorAll('[data-countup]').forEach(function (el) {
    var target = parseInt(el.getAttribute('data-countup'), 10);
    if (reduced || !('IntersectionObserver' in window)) return;
    el.textContent = '0';
    var cio = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        cio.unobserve(el);
        var start = null;
        function step(t) {
          if (!start) start = t;
          var p = Math.min((t - start) / 900, 1);
          el.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }, { threshold: 0.5 });
    cio.observe(el);
  });

  // Photo lightbox
  (function () {
    var dlg = document.getElementById('sws-lightbox');
    var grids = document.querySelectorAll('[data-gallery]');
    // <dialog> support is the floor here; without it the thumbnails simply stay
    // static images, which is a perfectly good fallback.
    if (!dlg || !grids.length || typeof dlg.showModal !== 'function') return;

    var items = [];
    grids.forEach(function (grid) {
      Array.prototype.forEach.call(grid.querySelectorAll('button[data-full]'), function (btn) {
        var i = items.length;
        items.push({
          full: btn.getAttribute('data-full'),
          cap: btn.getAttribute('data-cap') || '',
          alt: (btn.querySelector('img') || {}).alt || '',
          btn: btn,
        });
        btn.addEventListener('click', function () { open(i); });
      });
    });

    var stage = dlg.querySelector('.sws-lb-stage img');
    var capNum = dlg.querySelector('.sws-lb-cap b');
    var capTxt = dlg.querySelector('.sws-lb-cap span');
    var current = 0;

    function show(i) {
      // Wrap around, so the arrows never dead-end.
      current = (i + items.length) % items.length;
      var it = items[current];
      stage.src = it.full;
      stage.alt = it.alt;
      capNum.textContent = current + 1 + ' of ' + items.length;
      capTxt.textContent = it.cap;
    }

    function open(i) {
      show(i);
      dlg.showModal();
    }

    dlg.querySelector('.sws-lb-next').addEventListener('click', function () { show(current + 1); });
    dlg.querySelector('.sws-lb-prev').addEventListener('click', function () { show(current - 1); });
    dlg.querySelector('.sws-lb-close').addEventListener('click', function () { dlg.close(); });

    // Click the backdrop (i.e. anywhere that isn't the photo or a control).
    dlg.addEventListener('click', function (e) {
      if (e.target === dlg || e.target.classList.contains('sws-lb-stage')) dlg.close();
    });

    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
      // Escape is handled by <dialog> itself.
    });

    // Return focus to the thumbnail that was opened, so keyboard users don't
    // get dropped back at the top of the document.
    dlg.addEventListener('close', function () { items[current].btn.focus(); });
  })();
})();
</script>
</body>
</html>
